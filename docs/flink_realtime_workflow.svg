<?xml version="1.0" encoding="UTF-8"?>
<svg xmlns="http://www.w3.org/2000/svg"
     width="1600"
     height="960"
     viewBox="0 0 1600 960"
     role="img"
     aria-labelledby="title description">
  <title id="title">Flink SQL real-time retail data workflow</title>
  <desc id="description">
    PostgreSQL changes are captured by Debezium and stored in four Kafka CDC
    topics. One long-running Flink SQL job parses and types the events, writes
    four BigQuery Bronze tables, and branches typed order events together with
    Debezium heartbeats into five-minute order metrics.
  </desc>

  <defs>
    <linearGradient id="background" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#07111f"/>
      <stop offset="1" stop-color="#111827"/>
    </linearGradient>
    <linearGradient id="flink-panel" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#172033"/>
      <stop offset="1" stop-color="#101827"/>
    </linearGradient>
    <filter id="shadow" x="-20%" y="-20%" width="140%" height="150%">
      <feDropShadow dx="0" dy="7" stdDeviation="8"
                    flood-color="#000000" flood-opacity="0.3"/>
    </filter>
    <marker id="arrow" markerWidth="12" markerHeight="12"
            refX="10" refY="6" orient="auto" markerUnits="strokeWidth">
      <path d="M 0 0 L 12 6 L 0 12 Z" fill="#94a3b8"/>
    </marker>
    <marker id="arrow-cyan" markerWidth="12" markerHeight="12"
            refX="10" refY="6" orient="auto" markerUnits="strokeWidth">
      <path d="M 0 0 L 12 6 L 0 12 Z" fill="#22d3ee"/>
    </marker>
    <style>
      text {
        font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", sans-serif;
        fill: #f8fafc;
      }
      .title { font-size: 34px; font-weight: 750; letter-spacing: -0.5px; }
      .subtitle { font-size: 16px; fill: #94a3b8; }
      .section { font-size: 14px; font-weight: 750; letter-spacing: 1.3px; }
      .node-title { font-size: 19px; font-weight: 700; }
      .node-subtitle { font-size: 13px; fill: #cbd5e1; }
      .body { font-size: 13px; fill: #cbd5e1; }
      .small { font-size: 12px; fill: #94a3b8; }
      .tag { font-size: 11px; font-weight: 750; letter-spacing: 0.5px; }
      .flow {
        fill: none;
        stroke: #94a3b8;
        stroke-width: 3;
        stroke-linecap: round;
        stroke-linejoin: round;
        marker-end: url(#arrow);
      }
      .cyan-flow {
        fill: none;
        stroke: #22d3ee;
        stroke-width: 3;
        stroke-linecap: round;
        stroke-linejoin: round;
        marker-end: url(#arrow-cyan);
      }
      .thin-flow {
        fill: none;
        stroke: #64748b;
        stroke-width: 2;
        stroke-linecap: round;
        marker-end: url(#arrow);
      }
    </style>
  </defs>

  <rect width="1600" height="960" fill="url(#background)"/>

  <text class="title" x="55" y="55">Flink SQL real-time retail workflow</text>
  <text class="subtitle" x="55" y="84">
    Typed Bronze CDC history and heartbeat-driven event metrics from one continuous job
  </text>

  <text class="section" x="55" y="129" fill="#94a3b8">CDC SOURCE PATH</text>

  <g filter="url(#shadow)">
    <rect x="55" y="150" width="220" height="88" rx="14"
          fill="#18263a" stroke="#60a5fa" stroke-width="1.5"/>
    <circle cx="83" cy="179" r="9" fill="#60a5fa"/>
    <text class="node-title" x="103" y="186">PostgreSQL</text>
    <text class="node-subtitle" x="83" y="216">4 operational tables + WAL</text>

    <rect x="335" y="150" width="220" height="88" rx="14"
          fill="#2b1e2a" stroke="#e879f9" stroke-width="1.5"/>
    <circle cx="363" cy="179" r="9" fill="#e879f9"/>
    <text class="node-title" x="383" y="186">Debezium</text>
    <text class="node-subtitle" x="363" y="216">Snapshot + WAL + heartbeat</text>

    <rect x="615" y="132" width="380" height="124" rx="16"
          fill="#2b2318" stroke="#f59e0b" stroke-width="1.5"/>
    <circle cx="643" cy="162" r="9" fill="#f59e0b"/>
    <text class="node-title" x="663" y="169">Kafka</text>
    <text class="body" x="643" y="197">customers • products • orders • order_items</text>
    <text class="body" x="643" y="220">retail.heartbeat every 30 seconds</text>
    <rect x="844" y="145" width="125" height="25" rx="12.5" fill="#422006"/>
    <text class="tag" x="906.5" y="162" text-anchor="middle" fill="#fcd34d">
      5 APP TOPICS
    </text>
  </g>

  <path class="flow" d="M 275 194 H 326"/>
  <path class="flow" d="M 555 194 H 606"/>

  <g filter="url(#shadow)">
    <rect x="1050" y="132" width="495" height="124" rx="16"
          fill="#102a33" stroke="#22d3ee" stroke-width="1.5"/>
    <rect x="1075" y="151" width="148" height="26" rx="13" fill="#164e63"/>
    <text class="tag" x="1149" y="169" text-anchor="middle" fill="#67e8f9">
      ONE STATEMENT SET
    </text>
    <text class="body" x="1075" y="204">
      Orders are read and typed once, then shared by Bronze and metrics.
    </text>
    <text class="body" x="1075" y="228">
      Checkpoints coordinate Kafka progress and BigQuery commits.
    </text>
  </g>

  <rect x="35" y="300" width="1070" height="565" rx="24"
        fill="url(#flink-panel)" stroke="#fb7185" stroke-width="2"
        stroke-dasharray="9 7"/>
  <rect x="65" y="321" width="100" height="28" rx="14" fill="#881337"/>
  <text class="tag" x="115" y="340" text-anchor="middle" fill="#fecdd3">
    FLINK SQL
  </text>
  <text class="section" x="185" y="340" fill="#fda4af">
    ONE LONG-RUNNING JOB
  </text>

  <rect x="1130" y="300" width="435" height="565" rx="24"
        fill="#121f33" stroke="#60a5fa" stroke-width="2"/>
  <rect x="1160" y="321" width="112" height="28" rx="14" fill="#1e3a8a"/>
  <text class="tag" x="1216" y="340" text-anchor="middle" fill="#bfdbfe">
    BIGQUERY
  </text>
  <text class="section" x="1290" y="340" fill="#93c5fd">PERSISTED OUTPUTS</text>

  <g filter="url(#shadow)">
    <rect x="70" y="388" width="255" height="245" rx="16"
          fill="#2b2318" stroke="#f59e0b" stroke-width="1.5"/>
    <text class="node-title" x="197.5" y="422" text-anchor="middle">
      Kafka source tables
    </text>
    <text class="body" x="95" y="458">kafka_customers</text>
    <text class="body" x="95" y="486">kafka_products</text>
    <text class="body" x="95" y="514">kafka_orders</text>
    <text class="body" x="95" y="542">kafka_order_items</text>
    <text class="body" x="95" y="570">kafka_cdc_heartbeat</text>
    <text class="small" x="197.5" y="607" text-anchor="middle">
      Logical mappings • no storage
    </text>
  </g>

  <g filter="url(#shadow)">
    <rect x="385" y="375" width="335" height="270" rx="17"
          fill="#102a33" stroke="#22d3ee" stroke-width="2"/>
    <text class="node-title" x="552.5" y="410" text-anchor="middle">
      Typed CDC views
    </text>
    <text class="body" x="415" y="449">• Parse after, source, transaction, op</text>
    <text class="body" x="415" y="479">• Assign business SQL types</text>
    <text class="body" x="415" y="509">• Preserve delete keys</text>
    <text class="body" x="415" y="539">• Derive line_amount</text>
    <text class="body" x="415" y="569">• Add CDC and Kafka metadata</text>
    <text class="body" x="415" y="599">• Build deterministic cdc_event_id</text>
    <rect x="445" y="615" width="215" height="24" rx="12" fill="#164e63"/>
    <text class="tag" x="552.5" y="631" text-anchor="middle" fill="#67e8f9">
      NO BEFORE OBJECT STORED
    </text>
  </g>

  <path class="cyan-flow" d="M 325 510 H 376"/>

  <g filter="url(#shadow)">
    <rect x="785" y="375" width="280" height="270" rx="17"
          fill="#201a36" stroke="#a78bfa" stroke-width="1.5"/>
    <text class="node-title" x="925" y="410" text-anchor="middle">
      Statement Set branches
    </text>
    <rect x="815" y="439" width="220" height="72" rx="13"
          fill="#272032" stroke="#fbbf24"/>
    <text class="body" x="925" y="467" text-anchor="middle">4 typed CDC streams</text>
    <text class="small" x="925" y="491" text-anchor="middle">all r / c / u / d events</text>

    <rect x="815" y="535" width="220" height="86" rx="13"
          fill="#24203c" stroke="#a78bfa"/>
    <text class="body" x="925" y="563" text-anchor="middle">orders_typed + heartbeat</text>
    <text class="small" x="925" y="586" text-anchor="middle">op = c • 5-minute TUMBLE</text>
    <text class="small" x="925" y="607" text-anchor="middle">COUNT • SUM • AVG • DISTINCT</text>
  </g>

  <path class="cyan-flow" d="M 720 510 H 776"/>

  <g filter="url(#shadow)">
    <rect x="1165" y="378" width="365" height="252" rx="17"
          fill="#17263d" stroke="#fbbf24" stroke-width="1.5"/>
    <text class="node-title" x="1347.5" y="411" text-anchor="middle">
      retail_bronze
    </text>
    <text class="body" x="1195" y="450">customers_cdc</text>
    <text class="body" x="1195" y="480">products_cdc</text>
    <text class="body" x="1195" y="510">orders_cdc</text>
    <text class="body" x="1195" y="540">order_items_cdc</text>
    <text class="small" x="1195" y="577">Typed, tabular, append-only CDC history</text>
    <rect x="1195" y="592" width="154" height="23" rx="11.5" fill="#422006"/>
    <text class="tag" x="1272" y="608" text-anchor="middle" fill="#fcd34d">
      4 PHYSICAL TABLES
    </text>
  </g>

  <g filter="url(#shadow)">
    <rect x="1165" y="675" width="365" height="145" rx="17"
          fill="#17263d" stroke="#a78bfa" stroke-width="1.5"/>
    <text class="node-title" x="1347.5" y="708" text-anchor="middle">
      retail_realtime.order_metrics_5m
    </text>
    <text class="body" x="1195" y="744">Order count • revenue • AOV</text>
    <text class="body" x="1195" y="770">Unique customers • watermark heartbeat</text>
    <text class="small" x="1195" y="797">Event-time output, including empty windows</text>
  </g>

  <path class="flow" d="M 1065 475 H 1156"/>
  <path class="flow" d="M 1035 578 H 1085 V 747 H 1156"/>

  <rect x="70" y="690" width="995" height="130" rx="16"
        fill="#121e2e" stroke="#334155" stroke-width="1.5"/>
  <text class="section" x="96" y="721" fill="#94a3b8">DELIVERY AND RECOVERY</text>
  <circle cx="102" cy="751" r="6" fill="#22d3ee"/>
  <text class="body" x="119" y="756">
    BigQuery sinks use exactly-once delivery; data becomes visible after successful checkpoints.
  </text>
  <circle cx="102" cy="782" r="6" fill="#22d3ee"/>
  <text class="body" x="119" y="787">
    Business topics resume from consumer-group offsets; historical heartbeats are not replayed.
  </text>

  <path class="thin-flow" d="M 805 256 V 284 H 198 V 379"/>
  <text class="tag" x="448" y="279" text-anchor="middle" fill="#cbd5e1">
    UNBOUNDED EVENT STREAMS
  </text>

  <rect x="35" y="894" width="1530" height="39" rx="12"
        fill="#172033" stroke="#334155"/>
  <circle cx="63" cy="913.5" r="6" fill="#22d3ee"/>
  <text class="small" x="80" y="918">
    Flink temporary tables and views are logical definitions. Kafka retains streams; only BigQuery stores pipeline outputs.
  </text>
</svg>
