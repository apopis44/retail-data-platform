<?xml version="1.0" encoding="UTF-8"?>
<svg xmlns="http://www.w3.org/2000/svg"
     width="1600"
     height="700"
     viewBox="0 0 1600 700"
     role="img"
     aria-labelledby="title description">
  <title id="title">Retail data platform architecture</title>
  <desc id="description">
    PostgreSQL changes flow through Debezium and Kafka into Flink SQL. Flink
    writes four typed CDC tables to BigQuery Bronze and five-minute order
    metrics to BigQuery Realtime. The planned batch path uses Dagster and dbt
    to transform Bronze data into BigQuery Silver and Gold.
  </desc>

  <defs>
    <linearGradient id="background" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#07111f"/>
      <stop offset="1" stop-color="#111827"/>
    </linearGradient>
    <filter id="shadow" x="-20%" y="-20%" width="140%" height="150%">
      <feDropShadow dx="0" dy="7" stdDeviation="8"
                    flood-color="#000000" flood-opacity="0.3"/>
    </filter>
    <marker id="arrow" markerWidth="12" markerHeight="12"
            refX="10" refY="6" orient="auto" markerUnits="strokeWidth">
      <path d="M 0 0 L 12 6 L 0 12 Z" fill="#94a3b8"/>
    </marker>
    <marker id="arrow-cyan" markerWidth="12" markerHeight="12"
            refX="10" refY="6" orient="auto" markerUnits="strokeWidth">
      <path d="M 0 0 L 12 6 L 0 12 Z" fill="#22d3ee"/>
    </marker>
    <style>
      text {
        font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", sans-serif;
        fill: #f8fafc;
      }
      .title { font-size: 34px; font-weight: 750; letter-spacing: -0.5px; }
      .subtitle { font-size: 16px; fill: #94a3b8; }
      .lane { font-size: 13px; font-weight: 750; letter-spacing: 1.3px; }
      .node-title { font-size: 19px; font-weight: 700; }
      .node-subtitle { font-size: 13px; fill: #cbd5e1; }
      .small { font-size: 12px; fill: #94a3b8; }
      .tag { font-size: 11px; font-weight: 750; letter-spacing: 0.5px; }
      .flow {
        fill: none;
        stroke: #94a3b8;
        stroke-width: 3;
        stroke-linecap: round;
        stroke-linejoin: round;
        marker-end: url(#arrow);
      }
      .cyan-flow {
        fill: none;
        stroke: #22d3ee;
        stroke-width: 3;
        stroke-linecap: round;
        stroke-linejoin: round;
        marker-end: url(#arrow-cyan);
      }
      .planned-flow {
        fill: none;
        stroke: #64748b;
        stroke-width: 2.5;
        stroke-dasharray: 8 7;
        stroke-linecap: round;
        stroke-linejoin: round;
        marker-end: url(#arrow);
      }
    </style>
  </defs>

  <rect width="1600" height="700" fill="url(#background)"/>

  <text class="title" x="55" y="57">Retail data platform architecture</text>
  <text class="subtitle" x="55" y="87">
    Streaming ingestion through Bronze • scheduled warehouse transformations after Bronze
  </text>

  <rect x="35" y="125" width="1530" height="310" rx="24"
        fill="#101827" stroke="#334155" stroke-width="1.5"/>
  <rect x="58" y="145" width="174" height="27" rx="13.5" fill="#164e63"/>
  <text class="tag" x="145" y="163" text-anchor="middle" fill="#67e8f9">
    COMPLETED STREAMING PATH
  </text>

  <g filter="url(#shadow)">
    <rect x="70" y="218" width="205" height="105" rx="15"
          fill="#18263a" stroke="#60a5fa" stroke-width="1.5"/>
    <circle cx="97" cy="249" r="9" fill="#60a5fa"/>
    <text class="node-title" x="117" y="256">PostgreSQL</text>
    <text class="node-subtitle" x="97" y="288">4 operational tables</text>
    <text class="small" x="97" y="308">Source of truth + WAL</text>

    <rect x="335" y="218" width="205" height="105" rx="15"
          fill="#2b1e2a" stroke="#e879f9" stroke-width="1.5"/>
    <circle cx="362" cy="249" r="9" fill="#e879f9"/>
    <text class="node-title" x="382" y="256">Debezium</text>
    <text class="node-subtitle" x="362" y="288">Initial snapshot + WAL</text>
    <text class="small" x="362" y="308">CDC and heartbeat events</text>

    <rect x="600" y="218" width="205" height="105" rx="15"
          fill="#2b2318" stroke="#f59e0b" stroke-width="1.5"/>
    <circle cx="627" cy="249" r="9" fill="#f59e0b"/>
    <text class="node-title" x="647" y="256">Kafka</text>
    <text class="node-subtitle" x="627" y="288">4 CDC topics</text>
    <text class="small" x="627" y="308">+ retail.heartbeat</text>

    <rect x="865" y="200" width="245" height="141" rx="16"
          fill="#241c2a" stroke="#fb7185" stroke-width="2"/>
    <circle cx="892" cy="233" r="9" fill="#fb7185"/>
    <text class="node-title" x="912" y="240">Flink SQL</text>
    <text class="node-subtitle" x="892" y="273">Parse • type • derive</text>
    <text class="node-subtitle" x="892" y="298">Append CDC + window metrics</text>
    <rect x="892" y="311" width="146" height="22" rx="11" fill="#4c1728"/>
    <text class="tag" x="965" y="326" text-anchor="middle" fill="#fecdd3">
      ONE CONTINUOUS JOB
    </text>

    <rect x="1190" y="174" width="330" height="125" rx="16"
          fill="#17263d" stroke="#fbbf24" stroke-width="1.5"/>
    <circle cx="1218" cy="207" r="9" fill="#fbbf24"/>
    <text class="node-title" x="1238" y="214">BigQuery Bronze</text>
    <text class="node-subtitle" x="1218" y="247">4 typed, append-only CDC tables</text>
    <text class="small" x="1218" y="274">customers • products • orders • items</text>

    <rect x="1190" y="322" width="330" height="92" rx="16"
          fill="#17263d" stroke="#a78bfa" stroke-width="1.5"/>
    <circle cx="1218" cy="352" r="9" fill="#a78bfa"/>
    <text class="node-title" x="1238" y="359">BigQuery Realtime</text>
    <text class="node-subtitle" x="1218" y="389">order_metrics_5m • event time</text>
  </g>

  <path class="flow" d="M 275 270 H 326"/>
  <path class="flow" d="M 540 270 H 591"/>
  <path class="flow" d="M 805 270 H 856"/>
  <path class="cyan-flow" d="M 1110 249 H 1181"/>
  <path class="cyan-flow" d="M 1110 292 H 1145 V 368 H 1181"/>

  <rect x="35" y="470" width="1530" height="180" rx="24"
        fill="#0d1625" stroke="#334155" stroke-width="1.5"
        stroke-dasharray="9 7"/>
  <rect x="58" y="490" width="154" height="27" rx="13.5" fill="#293548"/>
  <text class="tag" x="135" y="508" text-anchor="middle" fill="#cbd5e1">
    PLANNED BATCH PATH
  </text>

  <g filter="url(#shadow)">
    <rect x="420" y="535" width="205" height="86" rx="15"
          fill="#1c2738" stroke="#64748b" stroke-width="1.5"/>
    <text class="node-title" x="522.5" y="567" text-anchor="middle">Dagster</text>
    <text class="node-subtitle" x="522.5" y="596" text-anchor="middle">
      Schedule and observe
    </text>

    <rect x="710" y="535" width="205" height="86" rx="15"
          fill="#1c2738" stroke="#64748b" stroke-width="1.5"/>
    <text class="node-title" x="812.5" y="567" text-anchor="middle">dbt</text>
    <text class="node-subtitle" x="812.5" y="596" text-anchor="middle">
      Resolve and model CDC
    </text>

    <rect x="1000" y="535" width="205" height="86" rx="15"
          fill="#17263d" stroke="#64748b" stroke-width="1.5"/>
    <text class="node-title" x="1102.5" y="567" text-anchor="middle">
      BigQuery Silver
    </text>
    <text class="node-subtitle" x="1102.5" y="596" text-anchor="middle">
      Current relational state
    </text>

    <rect x="1290" y="535" width="205" height="86" rx="15"
          fill="#17263d" stroke="#64748b" stroke-width="1.5"/>
    <text class="node-title" x="1392.5" y="567" text-anchor="middle">
      BigQuery Gold
    </text>
    <text class="node-subtitle" x="1392.5" y="596" text-anchor="middle">
      Analytics and reporting
    </text>
  </g>

  <path class="planned-flow" d="M 625 578 H 701"/>
  <path class="planned-flow" d="M 915 578 H 991"/>
  <path class="planned-flow" d="M 1205 578 H 1281"/>
  <path class="planned-flow" d="M 1520 236 H 1540 V 445 H 812 V 526"/>
  <text class="small" x="1080" y="460" text-anchor="middle">
    Bronze is the boundary between streaming ingestion and scheduled transformations
  </text>

  <text class="small" x="55" y="680">
    Solid paths are implemented. Dashed paths represent the next Dagster + dbt milestone.
  </text>
</svg>
