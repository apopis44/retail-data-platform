services:

  postgres:
    image: postgres:16
    container_name: retail-postgres
    restart: unless-stopped

    environment:
      POSTGRES_DB: retail
      POSTGRES_USER: retail_user
      POSTGRES_PASSWORD: retail_password

    ports:
      - "5432:5432"

    volumes:
      - postgres_data:/var/lib/postgresql/data

    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U retail_user -d retail"]
      interval: 5s
      timeout: 5s
      retries: 5

volumes:
  postgres_data: