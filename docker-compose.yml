services:

  postgres:
    image: postgres:16
    container_name: retail-postgres
    restart: unless-stopped

    environment:
      POSTGRES_DB: retail
      POSTGRES_USER: retail_user
      POSTGRES_PASSWORD: retail_password

    ports:
      - "5432:5432"

    volumes:
      - postgres_data:/var/lib/postgresql/data

    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U retail_user -d retail"]
      interval: 5s
      timeout: 5s
      retries: 5

  kafka:
    image: apache/kafka:4.0.0
    container_name: retail-kafka
    restart: unless-stopped

    ports:
      - "9092:9092"

    environment:
      KAFKA_NODE_ID: 1
      KAFKA_PROCESS_ROLES: broker,controller

      KAFKA_CONTROLLER_QUORUM_VOTERS: 1@kafka:9093

      KAFKA_LISTENERS: PLAINTEXT://:9092,CONTROLLER://:9093
      KAFKA_ADVERTISED_LISTENERS: PLAINTEXT://localhost:9092

      KAFKA_LISTENER_SECURITY_PROTOCOL_MAP: PLAINTEXT:PLAINTEXT,CONTROLLER:PLAINTEXT
      KAFKA_CONTROLLER_LISTENER_NAMES: CONTROLLER

      KAFKA_INTER_BROKER_LISTENER_NAME: PLAINTEXT

      KAFKA_OFFSETS_TOPIC_REPLICATION_FACTOR: 1
      KAFKA_TRANSACTION_STATE_LOG_REPLICATION_FACTOR: 1
      KAFKA_TRANSACTION_STATE_LOG_MIN_ISR: 1

      KAFKA_AUTO_CREATE_TOPICS_ENABLE: "FALSE"

    volumes:
      - kafka_data:/var/lib/kafka/data

    healthcheck:
      test: ["CMD-SHELL",
             "/opt/kafka/bin/kafka-broker-api-versions.sh --bootstrap-server localhost:9092 > /dev/null 2>&1"]
      interval: 10s
      timeout: 10s
      retries: 10
      start_period: 10s

  flink-jobmanager:
    image: flink:1.20.1-scala_2.12-java17
    container_name: retail-flink-jobmanager
    restart: unless-stopped
    command: jobmanager

    ports:
      - "8081:8081"

    environment:
      FLINK_PROPERTIES: "jobmanager.rpc.address: flink-jobmanager"

    volumes:
      - ./flink/jobs:/opt/flink/jobs

    healthcheck:
      test: ["CMD-SHELL",
             "curl -f http://localhost:8081/overview > /dev/null 2>&1 || exit 1" 
             ]
      interval: 10s
      timeout: 5s
      retries: 10
      start_period: 20s

  flink-taskmanager:
    image: flink:1.20.1-scala_2.12-java17
    container_name: retail-flink-taskmanager
    restart: unless-stopped
    command: taskmanager
    depends_on: 
      flink-jobmanager:
        condition: service_healthy

    environment:
      FLINK_PROPERTIES: "jobmanager.rpc.address: flink-jobmanager\ntaskmanager.numberOfTaskSlots: 2"

    volumes: 
      - ./flink/jobs:/opt/flink/jobs

    healthcheck:
      test: ["CMD-SHELL", "pgrep -f 'org.apache.flink.runtime.taskexecutor.TaskManagerRunner' > /dev/null || exit 1"]
      interval: 10s
      timeout: 5s
      retries: 10
      start_period: 30s


volumes:
  postgres_data:
  kafka_data: